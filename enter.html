<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uçuş panosu</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;background:#111;color:#eee;margin:0;padding:20px;max-width:480px;margin:auto}
h1{font-size:20px;margin:8px 0 16px}
label{display:block;font-size:13px;color:#aaa;margin:14px 0 4px}
input{width:100%;box-sizing:border-box;font-size:22px;padding:12px;border:1px solid #444;border-radius:8px;background:#222;color:#fff;text-transform:uppercase}
input#token{text-transform:none;font-size:14px}
input#date{text-transform:none;font-size:18px}
button{width:100%;font-size:18px;padding:14px;border:0;border-radius:8px;margin-top:12px;color:#fff;
  background:#2b7a3d;transition:transform .08s,filter .08s,opacity .15s;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98);filter:brightness(1.45)}
button:disabled{opacity:.45;transform:none;filter:none}
button.busy{opacity:.7}
button.done{background:#1f5c2c;box-shadow:inset 0 0 0 2px #7fd39a}
button.stop{background:#7a2b2b}
button.stop.done{background:#5c1f1f;box-shadow:inset 0 0 0 2px #d39a9a}
button.plain{background:#333}
#msg{margin-top:14px;font-size:14px;min-height:20px;color:#9d9}
#msg.err{color:#f88}
#status{margin-top:20px;font-size:13px;color:#aaa;white-space:pre-line}
iframe#preview{width:100%;aspect-ratio:800/480;margin-top:12px;border:1px solid #333;background:#fff}
details{margin-top:24px;font-size:13px;color:#aaa}
</style>
</head>
<body>
<h1>Uçuş panosu</h1>
<label>Uçuş numarası</label>
<input id="ident" placeholder="XX123" autocapitalize="characters">
<label>Tescil (opsiyonel, en güvenilir)</label>
<input id="reg" placeholder="XX-XXX" autocapitalize="characters">
<label>Tarih (opsiyonel, bugün ilerisi veya yarın için)</label>
<input id="date" type="date">
<button id="start">Başlat</button>
<button id="stop" class="stop">Durdur / fotoğraflar</button>
<div id="msg"></div>
<div id="status"></div>
<iframe id="preview" title="board"></iframe>
<details>
<summary>Token</summary>
<label>GitHub fine-grained token (yalnızca bu tarayıcıda saklanır)</label>
<input id="token" placeholder="github_pat_…">
<button id="save" class="plain">Token kaydet</button>
</details>
<script>
const OWNER="gozutok",REPO="status-board",WF="board.yml";
const $=id=>document.getElementById(id);
const tok=()=>localStorage.getItem("gh_token")||"";
$("token").value=tok();
$("save").onclick=()=>press($("save"),"Kaydediliyor\u2026",async()=>{localStorage.setItem("gh_token",$("token").value.trim());say("Token kaydedildi");return true;});
function say(t,err){$("msg").textContent=t;$("msg").className=err?"err":"";}
async function press(btn,label,fn){
  const was=btn.textContent;
  btn.disabled=true; btn.classList.add("busy"); btn.textContent=label;
  let ok=false;
  try{ ok=await fn(); }finally{
    btn.classList.remove("busy");
    btn.textContent=ok?"Gönderildi \u2713":was;
    if(ok)btn.classList.add("done");
    setTimeout(()=>{btn.disabled=false;btn.classList.remove("done");btn.textContent=was;},2200);
  }
}
async function dispatch(ident,reg,date){
  if(!tok()){say("Token yok \u2014 aşağıdaki Token bölümünü açın",true);return false;}
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WF}/dispatches`,{
    method:"POST",headers:{"Authorization":"Bearer "+tok(),"Accept":"application/vnd.github+json","Content-Type":"application/json"},
    body:JSON.stringify({ref:"main",inputs:{ident:ident,reg:reg,date:date||""}})});
  if(r.status===204){
    say(ident?`${[ident,reg,date].filter(Boolean).join(" ")} gönderildi. Pano 1-2 dakikada, panel bir sonraki yenilemesinde.`
              :"Durduruldu. Fotoğraflar bir sonraki turda döner.");
    setTimeout(refresh,4000);
    return true;
  }
  say("GitHub hatası "+r.status+" \u2014 token yetkisini kontrol edin (Actions: read and write)",true);
  return false;
}
$("start").onclick=()=>press($("start"),"Gönderiliyor\u2026",
  ()=>dispatch($("ident").value.trim().toUpperCase(),$("reg").value.trim().toUpperCase(),$("date").value));
$("stop").onclick=()=>press($("stop"),"Durduruluyor\u2026",()=>dispatch("","",""));
async function runInfo(){
  if(!tok())return "";
  try{
    const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs?per_page=1`,
      {headers:{"Authorization":"Bearer "+tok(),"Accept":"application/vnd.github+json"}});
    if(!r.ok)return "";
    const run=(await r.json()).workflow_runs[0];
    if(!run)return "";
    const mins=Math.round((Date.now()-new Date(run.created_at))/60000);
    const state=run.status==="completed"?run.conclusion:run.status;
    return `son çalıştırma: ${state} · ${mins} dk önce`;
  }catch(e){return "";}
}
async function refresh(){
  let line="";
  try{
    const c=await (await fetch("config.json?t="+Date.now())).json();
    if(c.ident){
      const age=Math.round((Date.now()-new Date(c.set_at))/60000);
      line=`takipte ${c.ident}${c.reg?" "+c.reg:""}${c.date?" · "+c.date:""} · ${age} dk önce girildi`;
      if(c.date)$("date").value=c.date;
    }else{line="boşta (fotoğraflar)";}
  }catch(e){line="ayar okunamadı";}
  const rl=await runInfo();
  $("status").textContent=rl?line+"\n"+rl:line;
  $("preview").src="index.html?t="+Date.now();
}
refresh();
setInterval(refresh,60000);
</script>
</body>
</html>
