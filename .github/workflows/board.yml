name: Update board

on:
  workflow_dispatch:
    inputs:
      ident:
        description: "Ident, e.g. XX123 (empty = stop)"
        required: false
        default: ""
      reg:
        description: "Registration, optional (most reliable)"
        required: false
        default: ""
      date:
        description: "Departure date YYYY-MM-DD, optional (pins which day's leg)"
        required: false
        default: ""
      chain:
        description: "Internal: 1 when a run is re-arming itself. Leave empty."
        required: false
        default: ""
  # Only a backstop: GitHub delivered one scheduled run out of eleven on this repo,
  # so the chain below is what actually keeps the board current. Odd minutes, since
  # the top of the hour and */5 are the most contended slots.
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: board
  # Only a person setting a flight preempts. A handover must not cancel the run it
  # is relieving — that run is in its teardown, and its cache post-step is what
  # carries the leg state forward — and neither must the cron, which has no inputs
  # at all and so used to read as "not a handover" and cancel a new flight thirty
  # seconds after it was entered.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.chain != '1' }}

env:
  # Pages caps freshness at ten minutes whatever we do, and its soft limit is ten
  # deployments an hour. Six minutes sits under that and costs almost no staleness.
  INTERVAL_S: "360"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # py_compile accepts a file whose functions have been deleted out from under
      # their callers. That happened, and the chain died on it. This does not.
      - run: python3 check.py fetch.py render.py
      - run: python3 test_fr24.py

      # Holds the Natural Earth/airport downloads, and the leg state: Flightradar24
      # forbids retaining API-derived data beyond 30 days, and nothing derived from
      # it is written to this public repository at all any more.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: geodata-${{ github.run_number }}
          restore-keys: geodata-

      - name: Apply input / restore state
        run: |
          mkdir -p .cache
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ github.event.inputs.chain }}" ]; then
            python3 - <<'PY'
          import json, datetime
          json.dump({"ident": "${{ github.event.inputs.ident }}".strip(),
                     "reg": "${{ github.event.inputs.reg }}".strip(),
                     "date": "${{ github.event.inputs.date }}".strip(),
                     "set_at": datetime.datetime.now(datetime.timezone.utc).isoformat()},
                    open("config.json", "w"))
          PY
            rm -f data.json .cache/state.json
            # The only thing still committed, and it is the user's own input rather
            # than anything from FR24. One commit per leg, not one per update.
            git config user.name "board-bot"
            git config user.email "board-bot@users.noreply.github.com"
            git add config.json
            git diff --cached --quiet || { git commit -q -m "leg $(date -u +%Y-%m-%dT%H:%MZ)"; git push -q; }
          else
            [ -f .cache/state.json ] && cp .cache/state.json data.json
            [ -f .cache/idle.json ] && cp .cache/idle.json idle.json
          fi
          true

      # The cron exists to revive a chain that died. If one is alive it has nothing
      # to do, and going ahead would leave two chains dispatching successors at each
      # other through the concurrency queue.
      - name: Skip if the chain is already running
        id: guard
        run: |
          beat=$(cat .cache/beat 2>/dev/null || echo 0)
          age=$(( $(date +%s) - beat ))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$age" -lt 900 ]; then
            echo "chain alive ($age s since last pass), nothing to do"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and render
        if: steps.guard.outputs.skip != '1'
        id: board
        env:
          FR24_TOKEN: ${{ secrets.FR24_TOKEN }}
          HOLD_AFTER_ARRIVAL_MIN: "90"
          LOCAL_TZ: Europe/Istanbul
          IDLE_ROTATE_MIN: "60"
        run: |
          python3 fetch.py
          cp data.json .cache/state.json

          # render.py once lost its tail to a bad edit and still exited 0, so the
          # workflow stayed green for hours while the panel showed a stale board.
          started=$(date +%s)
          python3 render.py
          mt=$(stat -c %Y index.html 2>/dev/null || echo 0)
          if [ "$mt" -lt "$started" ]; then
            echo "::error::render.py exited without rewriting index.html"
            exit 1
          fi

          cp idle.json .cache/idle.json 2>/dev/null || true
          date +%s > .cache/beat
          mkdir -p _site
          cp index.html board.svg board.png enter.html config.json _site/
          echo "tracking=$(python3 -c "import json;print(1 if json.load(open('data.json')).get('mode')=='leg' else 0)")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.skip != '1'
        with:
          path: _site

      - id: deploy
        if: steps.guard.outputs.skip != '1'
        uses: actions/deploy-pages@v4

      # A silent failure here freezes the board mid-flight, which is the exact class
      # of bug this project already had once. Fail the job instead of going quiet.
      # Hand over even when the run failed. A bad deploy used to end the chain
      # outright, and the board simply stopped until someone looked; five failures
      # in a row still stop it, so a permanently broken push cannot spin for ever.
      - name: Hand over to the next run
        if: always() && steps.board.outputs.tracking != '0'
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          fails=$(cat .cache/fails 2>/dev/null || echo 0)
          if [ "${{ job.status }}" = "success" ]; then
            echo 0 > .cache/fails
          else
            fails=$((fails + 1)); echo "$fails" > .cache/fails
            if [ "$fails" -ge 5 ]; then
              echo "::error::five runs failed in a row; stopping the chain"
              exit 1
            fi
            echo "run failed ($fails in a row) — handing over anyway"
          fi
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::DISPATCH_TOKEN is not set, so the chain cannot continue"
            exit 1
          fi
          sleep "$INTERVAL_S"
          code=$(curl -sS -o /tmp/dispatch.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/board.yml/dispatches" \
            -d '{"ref":"main","inputs":{"chain":"1"}}')
          if [ "$code" != "204" ]; then
            echo "::error::could not re-arm the chain (HTTP $code): $(cat /tmp/dispatch.txt)"
            exit 1
          fi
          echo "next run dispatched"
