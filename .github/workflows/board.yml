name: Update board

on:
  workflow_dispatch:
    inputs:
      ident:
        description: "Ident, e.g. XX123 (empty = stop)"
        required: false
        default: ""
      reg:
        description: "Registration, optional (most reliable)"
        required: false
        default: ""
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: .cache
          key: geodata-${{ github.run_number }}
          restore-keys: geodata-

      - if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import json, datetime, os
          json.dump({"ident": "${{ github.event.inputs.ident }}".strip(), "reg": "${{ github.event.inputs.reg }}".strip(),
                     "set_at": datetime.datetime.now(datetime.timezone.utc).isoformat()}, open("config.json", "w"))
          if os.path.exists("data.json"):
              os.remove("data.json")
          PY

      - env:
          HOLD_AFTER_ARRIVAL_MIN: "60"
        run: python3 fetch.py

      - env:
          LOCAL_TZ: Europe/Istanbul
          IDLE_ROTATE_MIN: "60"
        run: python3 render.py

      - run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add -A board.png config.json data.json idle.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "board $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
